
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAK WALLET</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
  color: #222;
}
.container {
  max-width: 450px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 15px;
}
.balance {
  background: #153c32;
  color: white;
}
.balance h1 {
  font-size: 32px;
  overflow-wrap: anywhere;
}
.stats {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
input, select, button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  box-sizing: border-box;
}
button {
  background: #153c32;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}
.income { color: green; }
.expense { color: red; }
.delete {
  width: auto;
  padding: 7px 9px;
  background: #ddd;
  color: #222;
}
.reset {
  background: #b3261e;
}
small { color: #777; }
</style>
</head>

<body>
<div class="container">

<div class="card balance">
  <h3>EAK WALLET 💰</h3>
  <p>Total Saldo</p>
  <h1 id="balance">Rp0</h1>
  <div class="stats">
    <div>Masuk<br><b id="income">Rp0</b></div>
    <div>Keluar<br><b id="expense">Rp0</b></div>
  </div>
</div>

<div class="card">
  <h3>Tambah Transaksi</h3>
  <input id="description" placeholder="Keterangan transaksi">
  <input id="amount" type="text"
    inputmode="numeric" placeholder="Jumlah uang">

  <select id="type">
    <option value="income">Uang Masuk</option>
    <option value="expense">Uang Keluar</option>
  </select>

  <input id="date" type="date">
  <button onclick="addTransaction()">SIMPAN TRANSAKSI</button>
</div>

<div class="card">
  <h3>Riwayat Transaksi</h3>
  <div id="history"></div>
</div>

<div class="card">
  <h3>Pengaturan</h3>
  <button class="reset" onclick="resetWallet()">
    🗑️ RESET SEMUA DATA
  </button>
  <small>Reset akan menghapus seluruh riwayat dan saldo.</small>
</div>

</div>

<script>
let transactions = JSON.parse(
  localStorage.getItem("transactions") || "[]"
);

const rupiah = n =>
  new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(n);

const amountInput = document.getElementById("amount");

amountInput.addEventListener("input", function() {
  let angka = this.value.replace(/\D/g, "");
  this.value = angka
    ? new Intl.NumberFormat("id-ID").format(angka)
    : "";
});

function save() {
  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );
  render();
}

function addTransaction() {
  const description =
    document.getElementById("description").value.trim();

  const amount = Number(
    amountInput.value.replace(/\D/g, "")
  );

  const type = document.getElementById("type").value;
  const date = document.getElementById("date").value;

  if (!description || amount <= 0 ||
      !Number.isSafeInteger(amount) || !date) {
    alert("Isi semua data dengan benar!");
    return;
  }

  transactions.unshift({
    id: Date.now(),
    description,
    amount,
    type,
    date
  });

  document.getElementById("description").value = "";
  amountInput.value = "";

  save();
}

function removeTransaction(id) {
  if (!confirm("Hapus transaksi ini?")) return;

  transactions = transactions.filter(t => t.id !== id);
  save();
}

function resetWallet() {
  const yakin = confirm(
    "PERINGATAN!\nSemua transaksi dan saldo akan dihapus. Yakin?"
  );

  if (!yakin) return;

  transactions = [];
  localStorage.removeItem("transactions");

  render();
  alert("EAK WALLET berhasil direset!");
}

function render() {
  let income = 0;
  let expense = 0;

  transactions.forEach(t => {
    if (t.type === "income") income += t.amount;
    else expense += t.amount;
  });

  document.getElementById("balance").textContent =
    rupiah(income - expense);

  document.getElementById("income").textContent =
    rupiah(income);

  document.getElementById("expense").textContent =
    rupiah(expense);

  const history = document.getElementById("history");

  if (transactions.length === 0) {
    history.innerHTML = "<p>Belum ada transaksi.</p>";
    return;
  }

  history.innerHTML = "";

  transactions.forEach(t => {
    const item = document.createElement("div");
    item.className = "item";

    const detail = document.createElement("div");
    const name = document.createElement("b");
    name.textContent = t.description;

    const date = document.createElement("small");
    date.textContent = t.date;

    detail.append(name, document.createElement("br"), date);

    const right = document.createElement("div");

    const amount = document.createElement("span");
    amount.className =
      t.type === "income" ? "income" : "expense";

    amount.textContent =
      (t.type === "income" ? "+" : "-") + rupiah(t.amount);

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Hapus";
    del.onclick = () => removeTransaction(t.id);

    right.append(amount, del);
    item.append(detail, right);
    history.appendChild(item);
  });
}

document.getElementById("date").value =
  new Date().toLocaleDateString("en-CA");

render();
</script>
</body>
</html>
