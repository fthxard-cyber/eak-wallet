
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>EAK WALLET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f4f7fb;font-family:Arial,sans-serif;padding:20px}
main{max-width:600px;margin:auto}
h1{letter-spacing:2px;font-size:22px}
.muted{color:#9aabc2;font-size:13px}
.card{background:#17243a;border:1px solid #263650;border-radius:20px;padding:22px;margin:15px 0}
.balance{font-size:36px;font-weight:bold;margin:12px 0 20px;overflow-wrap:anywhere}
.stats{display:flex;justify-content:space-between;gap:10px}
.green{color:#48d597}.red{color:#ff7185}
.actions{display:flex;gap:10px;margin:16px 0}
button{border:0;border-radius:12px;padding:13px;font-weight:bold;cursor:pointer}
.actions button{flex:1;background:#243b5c;color:white}
.actions button:last-child{background:#59303d}
input,select{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #354760;border-radius:10px;background:#0b1526;color:white}
form{background:#17243a;padding:18px;border-radius:18px;margin:15px 0}
.submit{width:100%;background:#78aaff;color:#081528}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 5px;border-bottom:1px solid #263650}
.item small{display:block;color:#9aabc2;margin-top:5px}
.item button{padding:7px;background:#263650;color:white}
.filters{display:flex;gap:7px;margin:12px 0}
.filters button{background:#243b5c;color:white}
.empty{text-align:center;padding:25px;color:#9aabc2}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1> EAK WALLET</h1>
<p class="muted">CATAT UANG SAKU PRIBADIMU</p>

<section class="card">
<div class="muted">SALDO UANG FISIK</div>
<div class="balance" id="saldo">Rp0</div>
<div class="stats">
<div><small class="muted">Uang masuk</small><br><b class="green" id="masuk">Rp0</b></div>
<div><small class="muted">Uang keluar</small><br><b class="red" id="keluar">Rp0</b></div>
</div>
</section>

<div class="actions">
<button onclick="buka('masuk')">＋ Uang Masuk</button>
<button onclick="buka('keluar')">− Uang Keluar</button>
</div>

<form id="form" class="hidden">
<h3 id="judul">Transaksi</h3>
<label>Nominal (Rp)</label>
<input id="nominal" type="number" min="1" step="1" placeholder="Contoh: 200000" required>
<label>Keterangan</label>
<input id="keterangan" maxlength="60" placeholder="Contoh: Beli makan" required>
<label>Kategori</label>
<select id="kategori">
<option>Uang saku</option>
<option>Makanan & minuman</option>
<option>Transportasi</option>
<option>Jajan</option>
<option>Belanja</option>
<option>Pendidikan</option>
<option>Hiburan</option>
<option>Lainnya</option>
</select>
<label>Tanggal</label>
<input id="tanggal" type="date" required>
<button class="submit" type="submit">Simpan Transaksi</button>
<button type="button" onclick="tutup()" style="width:100%;margin-top:8px;background:#354760;color:white">Batal</button>
</form>

<div class="card">
<h3>Ringkasan Bulan Ini</h3>
<div class="stats">
<div><small class="muted">Pemasukan</small><br><b class="green" id="bulanMasuk">Rp0</b></div>
<div><small class="muted">Pengeluaran</small><br><b class="red" id="bulanKeluar">Rp0</b></div>
</div>
</div>

<h3>Riwayat Transaksi</h3>
<div class="filters">
<button onclick="aturFilter('semua')">Semua</button>
<button onclick="aturFilter('masuk')">Masuk</button>
<button onclick="aturFilter('keluar')">Keluar</button>
</div>
<section class="card" id="riwayat">
<div class="empty">Belum ada transaksi.</div>
</section>

<p class="muted" style="text-align:center">EAK WALLET · Buku kas pribadi</p>
<button onclick="resetData()" style="width:100%;background:#59303d;color:white">Reset Semua Data</button>
</main>

<script>
const KEY="eak_wallet_data";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let jenis="masuk";
let editId=null;
let filter="semua";

const el=id=>document.getElementById(id);
const rp=n=>"Rp"+Number(n).toLocaleString("id-ID");
const hariIni=()=>new Date().toISOString().slice(0,10);

function simpan(){
 localStorage.setItem(KEY,JSON.stringify(data));
}

function buka(type,id=null){
 jenis=type;
 editId=id;
 let t=data.find(x=>x.id===id);
 el("judul").textContent=t?"Edit Transaksi":type==="masuk"?"Uang Masuk":"Uang Keluar";
 el("nominal").value=t?t.nominal:"";
 el("keterangan").value=t?t.keterangan:"";
 el("kategori").value=t?t.kategori:type==="masuk"?"Uang saku":"Makanan & minuman";
 el("tanggal").value=t?t.tanggal:hariIni();
 el("form").classList.remove("hidden");
 el("form").scrollIntoView({behavior:"smooth"});
}

function tutup(){
 el("form").classList.add("hidden");
 editId=null;
}

el("form").addEventListener("submit",function(e){
 e.preventDefault();
 let nominal=Number(el("nominal").value);
 let keterangan=el("keterangan").value.trim();
 let tanggal=el("tanggal").value;

 if(!Number.isSafeInteger(nominal)||nominal<=0||!keterangan||!tanggal){
  alert("Periksa kembali data transaksi.");
  return;
 }

 let transaksi={
  id:editId||Date.now().toString(),
  jenis,nominal,keterangan,
  kategori:el("kategori").value,
  tanggal
 };

 if(editId){
  let index=data.findIndex(x=>x.id===editId);
  data[index]=transaksi;
 }else{
  data.push(transaksi);
 }

 simpan();
 render();
 tutup();
});

function aturFilter(f){
 filter=f;
 render();
}

function hapus(id){
 if(confirm("Hapus transaksi ini?")){
  data=data.filter(x=>x.id!==id);
  simpan();
  render();
 }
}

function edit(id){
 let t=data.find(x=>x.id===id);
 if(t)buka(t.jenis,id);
}

function resetData(){
 if(confirm("Yakin menghapus semua transaksi?")){
  data=[];
  simpan();
  render();
 }
}

function render(){
 let totalMasuk=0,totalKeluar=0;
 let bulanMasuk=0,bulanKeluar=0;
 let bulan=hariIni().slice(0,7);

 data.forEach(t=>{
  if(t.jenis==="masuk"){
   totalMasuk+=t.nominal;
   if(t.tanggal.startsWith(bulan))bulanMasuk+=t.nominal;
  }else{
   totalKeluar+=t.nominal;
   if(t.tanggal.startsWith(bulan))bulanKeluar+=t.nominal;
  }
 });

 el("saldo").textContent=rp(totalMasuk-totalKeluar);
 el("masuk").textContent=rp(totalMasuk);
 el("keluar").textContent=rp(totalKeluar);
 el("bulanMasuk").textContent=rp(bulanMasuk);
 el("bulanKeluar").textContent=rp(bulanKeluar);

 let list=[...data].sort((a,b)=>
  b.tanggal.localeCompare(a.tanggal)||b.id.localeCompare(a.id)
 );

 if(filter!=="semua"){
  list=list.filter(t=>t.jenis===filter);
 }

 if(!list.length){
  el("riwayat").innerHTML='<div class="empty">Belum ada transaksi.</div>';
  return;
 }

 el("riwayat").innerHTML=list.map(t=>`
 <div class="item">
  <div style="min-width:0">
   <b>${aman(t.keterangan)}</b>
   <small>${aman(t.kategori)} · ${t.tanggal}</small>
   <b class="${t.jenis==="masuk"?"green":"red"}">
    ${t.jenis==="masuk"?"+":"−"}${rp(t.nominal)}
   </b>
  </div>
  <div style="display:flex;gap:5px">
   <button onclick="edit('${t.id}')">✎</button>
   <button onclick="hapus('${t.id}')">×</button>
  </div>
 </div>
 `).join("");
}

function aman(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

render();
</script>
</body>
</html>
